# Local / self-hosted stack: nginx (port 80) -> Hypercorn app (port 8000).
# Railway does not use this file; it builds the Dockerfile directly.
services:
  app:
    build: .
    environment:
      PORT: "8000"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
    volumes:
      - book-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  book-data:
