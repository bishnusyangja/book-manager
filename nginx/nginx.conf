# Reverse proxy in front of the FastAPI app (used by docker-compose.yml).
# Not needed on Railway, which already provides its own edge proxy.

upstream book_manager {
    server app:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 1024;

    location / {
        proxy_pass http://book_manager;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # Lightweight check that nginx itself is up.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
